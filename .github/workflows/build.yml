name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install the window's build dependencies
        # Fyne over GLFW: OpenGL, X11 and Wayland headers (this Fyne builds GLFW
        # with both back ends). The CLI needs none of this and builds with
        # CGO_ENABLED=0; the GUI package's tests still compile it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Test
        # Headless: the parity guard and the GUI tests need no display.
        run: make test

      - name: Lint
        # The Makefile downloads the pinned golangci-lint into GOPATH/bin and
        # runs it under the Go toolchain it was built with.
        run: make lint

      - name: Build the CLI without CGO
        run: CGO_ENABLED=0 make build

      - name: Lint the Windows-only files
        # The step above type-checks for Linux, which skips every *_windows.go.
        run: make lint-windows

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Test
        # Without cgo, so everything but the window (spec 020 R8.4); the
        # windows-zip job below compiles the window with MinGW.
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test $(go list -e ./... | grep -v -e /internal/gui -e /cmd/nmsbonker-gui)

  windows-zip:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc zip

      - name: Build nmsbonker.exe and nmsbonker-gui.exe
        # The version rule is the Makefile's: plain on a tag, VERSION-COMMIT-dev
        # otherwise, so a zip from a pull request cannot pass for the release.
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          commit="$(git rev-parse --short HEAD)"
          version="${tag}-${commit}-dev"
          if [ "${GITHUB_REF}" = "refs/tags/v${tag}" ]; then version="${tag}"; fi
          ldflags="-w -s -X github.com/ushineko/nmsbonker/internal/buildinfo.Version=${version} -X github.com/ushineko/nmsbonker/internal/buildinfo.Commit=${commit}"
          dir="nmsbonker-${version}-windows-amd64"
          mkdir -p "dist/${dir}"
          CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o "dist/${dir}/nmsbonker.exe" ./cmd/nmsbonker
          CGO_ENABLED=1 go build -trimpath -tags migrated_fynedo -ldflags="${ldflags} -H windowsgui"             -o "dist/${dir}/nmsbonker-gui.exe" ./cmd/nmsbonker-gui
          cp README.md LICENSE "dist/${dir}/"
          (cd dist && zip -r "${dir}.zip" "${dir}")
          ls -l dist/*.zip

      - name: Smoke-test the CLI
        run: |
          dist/nmsbonker-*-windows-amd64/nmsbonker.exe version
          dist/nmsbonker-*-windows-amd64/nmsbonker.exe status || true   # no game on a runner

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  build-arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
          # nodejs is for the GitHub Actions runtime inside the container.
          pacman -S --noconfirm base-devel git go gcc pkgconf mesa wayland wayland-protocols \
            libgl libx11 libxcursor libxrandr libxinerama libxi libxxf86vm libxkbcommon nodejs
          # makepkg refuses to run as root.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Build the package from this checkout
        run: |
          chown -R builder:builder src
          cd src
          su builder -c "git config --global --add safe.directory '$(pwd)'"
          # -s installs makedepends (already present); --noconfirm for pacman.
          # The PKGBUILD packages the tree it lives in, so a pull request
          # builds the pull request.
          su builder -c "cd packaging/arch && BUILDDIR=/tmp/nmsbonker-pkg makepkg -s --noconfirm"
          ls -l packaging/arch/*.pkg.tar.zst

      - name: Smoke-test the package
        run: |
          cd src/packaging/arch
          pacman -U --noconfirm ./*.pkg.tar.zst
          nmsbonker version
          nmsbonker status || true   # no game on a runner; the command must still answer
          desktop-file-validate /usr/share/applications/io.ushineko.nmsbonker.desktop || true

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: src/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Release
    needs: [test, test-windows, build-arch, windows-zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install the window's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Check the tag matches VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build the release tarballs
        # Static CLI for four targets, the GUI for the runner, SHA256SUMS.
        # VERSION passed explicitly: the tree is the tag, but the release is
        # never left to the Makefile's on-the-tag test.
        run: make release VERSION="$(tr -d '[:space:]' < VERSION)"

      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Add the Windows zip to SHA256SUMS
        run: cd dist && sha256sum *.zip >> SHA256SUMS && cat SHA256SUMS

      # The release notes are this version's changelog entry, not a list of
      # commit subjects. The entry is written for someone deciding whether to
      # upgrade; the commit list is written for someone who already has the
      # diff. GitHub's generated notes are kept as well, so the "Full
      # Changelog" link and the contributor list still appear, under the prose.
      - name: Take the release notes from the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "### " v) == 1 { f = 1; next }
            f && /^### / { exit }
            f { print }
          ' README.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "no changelog entry for $ver in README.md"; exit 1; }
          echo "--- notes ---"; cat dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/*.pkg.tar.zst
          body_path: dist/NOTES.md
          generate_release_notes: true
